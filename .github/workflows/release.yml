name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/sbair-modem/go.mod
          cache: false

      - name: Go tests and vet
        working-directory: src/sbair-modem
        run: |
          go test ./... -count=1
          go vet ./...

      - name: Install fixture dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep

      - name: Build ARM64 backend
        run: ./build.sh

      - name: Run shell and publication fixtures
        run: |
          for t in tests/*-fixture.sh; do
            case "$t" in
              tests/iperf3-parser-fixture.sh|tests/publication-hygiene-fixture.sh) bash "$t" ;;
              *) sh "$t" ;;
            esac
          done

      - name: Check localized release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/${version}.md"
          test -s "$notes" || { echo "Missing localized release notes: $notes" >&2; exit 1; }
          grep -Fq '[English](#english)' "$notes"
          grep -Fq '[日本語](#日本語)' "$notes"
          grep -Fq '[한국어](#한국어)' "$notes"
          grep -Fq '## English' "$notes"
          grep -Fq '## 日本語' "$notes"
          grep -Fq '## 한국어' "$notes"

      - name: Package release bundle
        run: sh ./tools/package-release.sh "$GITHUB_REF_NAME" --use-existing-binary

      - name: Check packaged installation and removal
        run: sh ./tools/check-release-bundle.sh "out/release/floop3-$GITHUB_REF_NAME-air6-linux-arm64.tar.gz"

      - name: Publish release with bundle and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "out/release/floop3-$GITHUB_REF_NAME-air6-linux-arm64.tar.gz" \
            "out/release/floop3-$GITHUB_REF_NAME-air6-linux-arm64.tar.gz.sha256" \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "docs/releases/$version.md"
